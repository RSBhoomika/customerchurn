# PIPELINE DEFINITION
# Name: customer-churn-training
# Inputs:
#    aws_access_key_id: str [Default: '****']
#    aws_secret_access_key: str [Default: '****']
#    data_url: str [Default: 'https://raw.githubusercontent.com/IBM/telco-customer-churn-on-icp4d/master/data/Telco-Customer-Churn.csv']
#    experiment_name: str [Default: 'customer-churn']
#    mlflow_s3_endpoint_url: str [Default: 'http://<MINIO_ENDPOINT>']
#    mlflow_tracking_uri: str [Default: 'http://<MLFLOW_TRACKING_URI>']
#    model_type: str [Default: 'logreg_balanced']
#    registered_model_name: str [Default: 'customer-churn']
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_data:
