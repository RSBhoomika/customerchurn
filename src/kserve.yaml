apiVersion: v1
kind: Secret
metadata:
  name: churn-minio-s3
  namespace: churn
  annotations:
    serving.kserve.io/s3-endpoint: <MINIO_IP>:<MINIO_PORT>
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
    serving.kserve.io/s3-useanoncredential: "false"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "****"
  AWS_SECRET_ACCESS_KEY: "****"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: churn-minio-sa
  namespace: churn
secrets:
  - name: churn-minio-s3
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: kserve-mlserver-mlflow
  namespace: churn
spec:
  supportedModelFormats:
    - name: mlflow
      version: "0"
      autoSelect: true
  protocolVersions:
    - v2
  containers:
    - name: kserve-container
      image: docker.io/seldonio/mlserver:1.6.1
      env:
        - name: MLSERVER_MODELS_DIR
          value: /mnt/models
        - name: MLSERVER_MODEL_URI
          value: /mnt/models
        - name: MLSERVER_HTTP_PORT
          value: "8080"
        - name: MLSERVER_GRPC_PORT
          value: "8081"
        - name: MLSERVER_MODEL_IMPLEMENTATION
          value: mlserver_mlflow.MLflowRuntime
        - name: MLSERVER_MODEL_NAME
          value: customer-churn
        - name: MLSERVER_LOAD_MODELS_AT_STARTUP
          value: "true"
      resources:
        requests:
          cpu: "500m"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: customer-churn
  namespace: churn
spec:
  predictor:
    serviceAccountName: churn-minio-sa
    minReplicas: 1
    model:
      modelFormat:
        name: mlflow
        version: "0"
      runtime: kserve-mlserver-mlflow
      protocolVersion: v2
      storageUri: s3://<STORAGE_URI>
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
